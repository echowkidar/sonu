<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b4cca" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>SONU</title>
    <meta name="description" content="Work requests, jobs and evidence for facilities teams." />
    <!-- Link previews (WhatsApp etc.). New file name so apps don't reuse the old cached icon. -->
    <meta property="og:site_name" content="SONU" />
    <meta property="og:title" content="SONU" />
    <meta property="og:description" content="Work requests, jobs and evidence for facilities teams." />
    <meta property="og:image" content="https://sonu.echowkidar.in/og-logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <script>
      try {
        var t = localStorage.getItem('sonu.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        var d = localStorage.getItem('sonu.dir');
        if (d === 'rtl') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
